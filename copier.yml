# Tofu-repo copier template — stamps a Forge OpenTofu/IaC *substrate star*: a thin
# per-substrate repo whose runtime is declared as `kreuzwerker/docker` resources
# and deployed via Nereus, never hand-composed. Sibling of python-repo-template;
# same governance + spec-kit spine, a Tofu body instead of Python. copier lays the
# repo body; the final `_task`s run `specify init` (the SDD scaffold) then
# `furnace ignite --kit code-repo-sdd` (the governance kit) so the repo is born
# spec-kit-ready and governed. The STAMPED repo has no uv/pyproject and no Python
# env; THIS repo carries a .pre-commit-config.yaml of its own as of 2026-08-12 —
# see README "Development (on this template repo)". The distinction is the whole
# point: every template here gated its children and never itself.

_subdirectory: template

# `_skip_if_exists` = every rendered path EXCEPT the seam (.gitignore). A tofu
# repo is DIFFERENT from an app-service star: its `.tf` files (main/variables/
# providers/versions) are the star's OWN infrastructure logic — never-touch, not
# a dep-manifest seam — and star.toml is hephaestus-derived. So copier only
# 3-way-merges .gitignore; everything else is create-if-absent (docs) or
# skipped-here-clobbered-by-anneal (the CI). RENDERED paths (template/ + .jinja
# stripped). PROVISIONAL: providers.tf/versions.tf ownership (foundry-clobber vs
# star-pin) is deferred to C2/ownership.py; skip is the safe default. Kept in
# sync with hephaestus `ownership.py`'s non-seam set (Flame C1).
_skip_if_exists:
  # star-owned: docs (create-if-absent) + the star's own tofu logic (never-touch)
  - README.md
  - LICENSE
  - main.tf
  - variables.tf
  - providers.tf
  - versions.tf
  - star.toml
  # THE LAST TWO MERGED PATHS, CLOSED 2026-08-12. main.tf and its siblings were
  # already skipped, so this template's dependency manifest was never the exposure
  # the other four had — but .gitignore and cliff.toml were still 3-way MERGED.
  #
  # .gitignore is CONSUMER-CUSTOMISED, and that is not hypothetical: a frontend
  # star was measured about to lose nine local lines on an update, among them the
  # furnace-provisioned ignores and a `!tools/parity/fixtures/**` negation whose
  # own comment records it fixing a CI outage on fresh checkouts. cliff.toml is
  # template-owned conformance and takes the anneal route with its neighbours.
  #
  # Walking template/ now leaves .copier-answers.yml as the only unskipped
  # rendered path, and copier owns that one — it is how the pin advances. A change
  # to anything else reaches only NEW stamps unless it ships with a versioned
  # `_migrations` entry at the `after` stage (the only stage that runs once copier
  # has reapplied its diff; a `_task` runs before it and is overwritten).
  - .gitignore
  - cliff.toml
  # foundry conformance: skipped here, clobbered by anneal (C2)
  - .forgejo/**
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Human-readable project name (e.g. "Chronos")

service_name:
  type: str
  help: Distribution / repo / image name (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

description:
  type: str
  help: One-line repo description
  default: A Forge OpenTofu substrate repo, deployed via Nereus.

charter:
  type: str
  help: "The star's single-responsibility charter (<= 100 chars) — the SRP gate"
  default: "{{ description }}"

cluster:
  type: str
  help: Constellation cluster this star belongs to
  default: pantheon

substrate_kind:
  type: str
  help: "Substrate engine/kind — the upstream image this substrate star runs (sets star.toml [substrate].kind). 'none' for a non-substrate star."
  choices:
    "none (not a substrate star)": ""
    postgres: postgres
    pgvector: pgvector
    redpanda: redpanda
    otelcol: otelcol
    opa: opa
  default: ""

star_namespace:
  type: str
  help: "Sovereign namespace this substrate owns (no shared tables across stars)"
  default: "{{ service_name | replace('-', '_') }}"

interface_protocol:
  type: str
  help: "The substrate's primary sync wire (postgres | redpanda | http | tcp) — satisfies Reachability"
  default: "{{ substrate_kind or 'tcp' }}"

interstellar:
  type: bool
  help: "Produces/consumes Kafka events? Adds async = [\"kafka\"] to the manifest."
  default: false

docker_host:
  type: str
  help: "Docker daemon endpoint Tofu provisions against (the nas01 host)"
  default: "ssh://rob@nas01"

author_name:
  type: str
  help: Copyright holder / author
  default: Rob Fischer

year:
  type: int
  help: Copyright year
  default: 2026

# Init-only setup, run by `copier copy --trust` (gated to copy, skipped on
# `copier update`). Mirrors the python template's spine, minus the Python steps.
_tasks:
  - command: git init -q
    when: "{{ _copier_operation == 'copy' }}"
  # Remotes follow the post-F27 fleet convention: ORIGIN IS THE OUREA DOOR, not
  # Forgejo. The door is the authoritative git-remote gateway (it serves real
  # fetch/pull since 2026-07-19 and gates landings via Serves); Forgejo stays a
  # FETCH-ONLY remote with its push side disabled by the `no_push_f27` sentinel,
  # so a stray `git push forgejo` fails loudly instead of bypassing the gate.
  # GitHub remains the push-mirror. NOTE the door path takes a BARE repo name
  # (no `rob/` prefix), unlike Forgejo; `git.notusmi.com` is the door's canonical
  # hostname (HTTPS, and it survives an address change, unlike the raw :8215
  # tailnet address).
  # The remote repo must be created on Forgejo first (push-to-create is disabled
  # instance-wide); these only wire the local remotes to the convention.
  - command: git remote add origin https://git.notusmi.com/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote add forgejo https://forgejo.notusmi.com/rob/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote set-url --push forgejo no_push_f27
    when: "{{ _copier_operation == 'copy' }}"
  - command: git remote add github https://github.com/robfischer1/{{ service_name }}.git
    when: "{{ _copier_operation == 'copy' }}"
  # Language-agnostic secret baseline (no enforcing pre-commit hook — there is no
  # Python env to run it; secret-scanning is enforced in CI instead).
  - command: uvx detect-secrets@1.5.0 scan > .secrets.baseline
    when: "{{ _copier_operation == 'copy' }}"
  # Spec-Driven Development scaffold. `git init -q` above is load-bearing (spec-kit
  # no longer git-inits since 0.10.0). `specify` must be on PATH.
  - command: specify init --here --force --integration claude --script ps --ignore-agent-tools
    when: "{{ _copier_operation == 'copy' }}"
  # Cede CLAUDE.md to furnace (the <!-- SPECKIT --> agent-context extension fights
  # furnace's CLAUDE.md @AGENTS.md shim). Deprecated upstream; disable now.
  - command: specify extension disable agent-context
    when: "{{ _copier_operation == 'copy' }}"
  # Pour the furnace governance kit (the .claude/ AI layer) last. code-repo-sdd =
  # code-repo + the speckit surface (.specify/ overrides + the speckit-plan command
  # override + /execute). Must run AFTER `specify init` so the override wins as last
  # writer. Needs `furnace` on PATH + $FURNACE_SOURCE set.
  - command: furnace ignite . --kit code-repo-sdd
    when: "{{ _copier_operation == 'copy' }}"
  # Verify the plan-command override resolves as the project-tier winner.
  - command: specify preset resolve speckit.plan
    when: "{{ _copier_operation == 'copy' }}"

_migrations:
# ONE-OFF SWEEP for v0.3.1: carry the fixed cliff.toml release header to stars already born.
#
# `cliff.toml` is in `_skip_if_exists` above, so `copier update` will not deliver
# this — a versioned migration is the mechanism this file already names for
# exactly that case. It runs at the `after` stage, once copier has reapplied
# its diff, which is why a `_task` cannot do it: tasks run BEFORE that.
#
# The old block shipped two defects (rob/python-repo-template#3143): it tagged
# without moving the version literal, and its own documented invocation
# `just release EXECUTE=1` silently dry-ran, because just reads NAME=value as a
# variable assignment and the recipe PARAMETER kept its "0" default.
#
# EXACT-MATCH, NEVER A GUESS. The patch applies only if the star still carries
# the old block byte-for-byte. A star that edited its own copy is REPORTED and
# LEFT ALONE — this file's own standard is that "a merge silently guesses", and
# a sweep that clobbers a local edit would be the same sin in a new coat.
#
# The payloads are base64 because this command is Jinja-rendered AND shell-
# embedded AND Python-embedded; the old block contains `{{EXECUTE}}`, which
# Jinja would otherwise eat. Regenerate with:
#   git show <sha>:template/cliff.toml | python3 -c 'import base64,sys;print(base64.b64encode(sys.stdin.buffer.read()).decode())'
  - version: v0.3.1
    when: "{{ _stage == 'after' }}"
    command: |
      python3 - <<'SWEEP'
      import base64, pathlib, sys
      OLD = base64.b64decode("").decode()
      NEW = base64.b64decode("").decode()
      p = pathlib.Path("cliff.toml")
      if not p.exists():
          print("copier: no cliff.toml here - nothing to sweep"); sys.exit(0)
      t = p.read_text(encoding="utf-8")
      if NEW in t:
          print("copier: cliff.toml release header already carries the fix"); sys.exit(0)
      if OLD not in t:
          print("copier: cliff.toml release header is neither the old shipped block nor the new one -")
          print("copier: LEAVING IT ALONE. Reconcile by hand against v0.3.1.")
          sys.exit(0)
      p.write_text(t.replace(OLD, NEW, 1), encoding="utf-8")
      print("copier: swept the cliff.toml release header - neither command tags")
      print("copier: the door mints the tag when the landing merges")
      SWEEP
